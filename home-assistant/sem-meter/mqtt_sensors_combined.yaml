# =============================================================================
# Combined raw MQTT sensor config: SEM-METER (Fusion Energy Smart Home
# Energy Monitor) + DTE Energy Bridge v2.
#
# This is NOT part of the packages/ setup and does NOT get placed in
# config/packages/ - it goes directly in the user's own configuration.yaml
# (or a file it !includes), since it needs to be the ONLY top-level
# `mqtt:` key across the whole config.
#
# IMPORTANT - why the DTE sensors are here instead of in
# packages/solar_dashboard.yaml: they used to live in the package as its
# own separate top-level `mqtt:` key. That broke once configuration.yaml
# also defined its own `mqtt:` key for the SEM-METER - having `mqtt:`
# defined in both configuration.yaml AND a package does NOT merge safely
# in practice, confirmed by the DTE entities showing "This entity is no
# longer being provided by the mqtt integration" in the UI once both
# existed. The fix: exactly one `mqtt:` key, in one file, containing every
# MQTT sensor this project needs - which is why the DTE sensors were moved
# into this file, merged into the same `sensor:` list as the SEM-METER's.
# If you ever add more MQTT sensors for anything else, add them here too
# rather than creating another `mqtt:` key anywhere else.
#
# The SEM-METER sensors subscribe to SEMMETER/8CBFEA0AA402/HA and parse a
# `sense` array by index; each circuit gets voltage/current/active
# power/energyIn/energyOut sensors. Entity IDs below are HA's default
# slugified-from-name IDs (no unique_id is set on these, so verify in
# Developer Tools > States if anything doesn't match after a config
# change). The DTE sensors (at the end of the list) do have unique_id set.
# The DTE Bridge itself is reached via the Mosquitto bridge in
# ../mosquitto/dte_bridge.conf mirroring its "event/metering/#" topics in.
#
# Circuit map (sense[] index -> name -> role in the solar dashboard):
#   0  Inverter In L1   -> grid power INTO inverter, leg 1
#   1  Inverter In L2   -> grid power INTO inverter, leg 2
#   2  Inverter Out L2  -> inverter output TO backed-up panel, leg 2
#   3  Inverter Out L1  -> inverter output TO backed-up panel, leg 1
#   4  A/C              -> HVAC compressor/condenser
#   5  Barn L2
#   6  Barn L1
#   7  Laundry          -> not currently used by the dashboard package
#   8  Well Pump        -> not currently used by the dashboard package
#   9  Sump Pumps       -> not currently used by the dashboard package
#   10 HVAC Blower
#   11-15 circuit12-circuit16 -> unused/spare channels
#   16-18 (summed)     -> "Main circuit" - total across 3 CTs, not
#                          currently used by the dashboard (DTE Energy
#                          Bridge is used for grid total instead, since it
#                          also captures a garage load that taps off the
#                          service before the main panel - see ../README.md)
# =============================================================================
mqtt:
  sensor:
    - name: "Main circuit current"
      state_topic: "SEMMETER/8CBFEA0AA402/HA"
      value_template: "{{( value_json.sense[16][1] | float | multiply(0.01)| round(2) +  value_json.sense[17][1] | float | multiply(0.01)| round(2) + value_json.sense[18][1] | float | multiply(0.01)| round(2) )| round(2)}}"
      unit_of_measurement: "A"
      icon: "mdi:current-ac"
      device_class: current
