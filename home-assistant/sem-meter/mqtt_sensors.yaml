# =============================================================================
# SEM-METER (Fusion Energy Smart Home Energy Monitor) raw MQTT sensor config.
#
# This is NOT part of the packages/ setup and does NOT get placed in
# config/packages/ - it's kept here purely as a record of what's already
# configured elsewhere in the user's own Home Assistant config (their
# configuration.yaml or an included file), since it replaced the earlier
# blueprint-generated entities and is now the actual source of the
# SEM-METER entity IDs the solar dashboard package depends on.
#
# IMPORTANT: this defines a top-level `mqtt:` key. Do NOT paste this into
# packages/solar_dashboard.yaml, which already has its own `mqtt:` key (for
# the DTE Energy Bridge sensors) - a second `mqtt:` key in the same YAML
# file would silently overwrite the first when parsed (same class of bug
# fixed earlier in this project's history with a duplicate `template:` key).
# Keep this wherever it currently lives in the user's actual config.
#
# Subscribes to SEMMETER/8CBFEA0AA402/HA and parses a `sense` array by
# index; each circuit gets voltage/current/active power/energyIn/energyOut
# sensors. Entity IDs below are HA's default slugified-from-name IDs (no
# unique_id is set on these, so verify in Developer Tools > States if
# anything doesn't match after a config change).
#
# Circuit map (sense[] index -> name -> role in the solar dashboard):
#   0  Inverter In L1   -> grid power INTO inverter, leg 1
#   1  Inverter In L2   -> grid power INTO inverter, leg 2
#   2  Inverter Out L2  -> inverter output TO backed-up panel, leg 2
#   3  Inverter Out L1  -> inverter output TO backed-up panel, leg 1
#   4  A/C              -> HVAC compressor/condenser
#   5  Barn L2
#   6  Barn L1
#   7  Laundry          -> not currently used by the dashboard package
#   8  Well Pump        -> not currently used by the dashboard package
#   9  Sump Pumps       -> not currently used by the dashboard package
#   10 HVAC Blower
#   11-15 circuit12-circuit16 -> unused/spare channels
#   16-18 (summed)     -> "Main circuit" - total across 3 CTs, not
#                          currently used by the dashboard (DTE Energy
#                          Bridge is used for grid total instead, since it
#                          also captures a garage load that taps off the
#                          service before the main panel - see ../README.md)
# =============================================================================
mqtt:
  sensor:
    - name: "Main circuit current"
      state_topic: "SEMMETER/8CBFEA0AA402/HA"
      value_template: "{{( value_json.sense[16][1] | float | multiply(0.01)| round(2) +  value_json.sense[17][1] | float | multiply(0.01)| round(2) + value_json.sense[18][1] | float | multiply(0.01)| round(2) )| round(2)}}"
      unit_of_measurement: "A"
      icon: "mdi:current-ac"
      device_class: current
      state_class: measurement

