# =============================================================================
# Solar / Off-Grid Inverter Energy Dashboard — Home Assistant package
# =============================================================================
#
# WHY THIS EXISTS
# ----------------
# The off-grid inverter has no communication interface, so solar production
# is never measured directly. This package derives it (and every other
# dashboard metric) from three real sensors:
#
#   1. Solar Assistant  -> battery power (signed: + = charging, - = discharging)
#   2. Fusion Energy CTs -> inverter output power (to the 100A backed-up panel)
#                        -> grid input power (into the inverter, for charging
#                           / pass-through)
#   3. DTE Energy Bridge -> total grid import power (the whole house, as seen
#                           by the utility meter)
#
# The energy-balance identity at the inverter's DC bus is:
#
#     solar_in + grid_in = load_out + battery_charge - battery_discharge
#
# Rearranged, solar production is whatever is left over:
#
#     solar_production = load_out + battery_power(signed) - grid_into_inverter
#
# See ../README.md for the full explanation, required CT clamp placement,
# and a sanity-check procedure. SEM-METER, Solar Assistant, and DTE Energy
# Bridge entity IDs below are wired to real entities. The DTE Bridge reaches
# HA via a Mosquitto bridge connection (see ../mosquitto/dte_bridge.conf and
# the README's "DTE Energy Bridge" section) rather than any native
# integration - DTE's v2 hardware has none.
#
# The DTE Bridge measures at the utility meter, upstream of a garage that
# taps off the service before the main panel - it's the only sensor in this
# system that captures that garage load, which is why it's used here
# instead of the SEM-METER's own main-panel CTs.
#
# ELECTRICITY RATES are hardcoded below from DTE's published "Time of Day
# 3 p.m. - 7 p.m. Rate" plan (captured 2026-08-06). Peak window is Mon-Fri
# 3pm-7pm year-round; weekends are off-peak all day. Off-peak rate is flat
# year-round; peak rate is season-dependent. If DTE revises these rates,
# update the numbers in the "Energy Cost Today" / "Solar Savings Today"
# templates below and in dashboards/solar_dashboard.yaml's rate info card.
#
#   Off-peak (any time Sat/Sun, or weekdays outside 3pm-7pm): 18.44 cents/kWh
#   Peak, summer   (Jun 1 - Sep 30, Mon-Fri 3pm-7pm):         24.13 cents/kWh
#   Peak, non-summer (Oct 1 - May 31, Mon-Fri 3pm-7pm):       20.05 cents/kWh
# =============================================================================

# -----------------------------------------------------------------------------
# DTE Energy Bridge v2, reached via the Mosquitto bridge in
# ../mosquitto/dte_bridge.conf mirroring its "event/metering/#" topics in.
# -----------------------------------------------------------------------------
mqtt:
  sensor:
    - name: "DTE Instantaneous Demand"
      icon: mdi:transmission-tower
      unique_id: dte_instantaneous_demand
      state_topic: "event/metering/instantaneous_demand"
      unit_of_measurement: "W"
      value_template: "{{ value_json.demand | default(0) | round(0) }}"
      device_class: power
      state_class: measurement

    # Not consumed by this package's templates (which build daily totals
    # themselves via the `integration` + `utility_meter` sensors below) -
    # kept as a second, independently-sourced energy reading you can feed
    # into HA's native Energy dashboard if you want one.
    - name: "DTE Energy Bridge"
      icon: mdi:transmission-tower
      unique_id: dteenergybridge
      state_topic: "event/metering/summation/minute"
      unit_of_measurement: "kWh"
      # the Energy Bridge returns Watt-minutes every minute in "value";
      # convert to kWh
      value_template: "{{ value_json.value | float / 60000 }}"
      # "time" in the message is a Unix-like timestamp (ms) of the start of
      # the last reading
      last_reset_value_template: "{{ now().fromtimestamp(value_json.time / 1000).replace(tzinfo=now().tzinfo) }}"
      device_class: energy
      state_class: total

# -----------------------------------------------------------------------------
# Power sensors (instantaneous, Watts) - combine raw CT channels into the
# four quantities the rest of this file needs.
# -----------------------------------------------------------------------------
template:
  - sensor:
      # Sum of both legs of the CT pair clamped on the wires between the
      # inverter and the 100A backed-up panel.
      - name: "Inverter Output Power"
        unique_id: inverter_output_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.sem_meter_inverter_output_l1_power') | float(0))
             + (states('sensor.sem_meter_inverter_output_l2_power') | float(0)) }}

      # Sum of both legs of the CT pair clamped on the 240V breaker feeding
      # the inverter from the main panel (grid power going INTO the inverter).
      - name: "Grid Into Inverter Power"
        unique_id: grid_into_inverter_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.sem_meter_grid_to_inverter_l1_power') | float(0))
             + (states('sensor.sem_meter_grid_to_inverter_l2_power') | float(0)) }}

      # Estimated real-time solar production, derived from the energy
      # balance. Clamped at 0 to absorb sensor noise around idle.
      - name: "Solar Production Power"
        unique_id: solar_production_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set load_out = states('sensor.inverter_output_power') | float(0) %}
          {% set battery = states('sensor.totals_battery_power') | float(0) %}
          {% set grid_in = states('sensor.grid_into_inverter_power') | float(0) %}
          {{ [0, load_out + battery - grid_in] | max | round(0) }}
          {# Sign convention assumed: sensor.totals_battery_power is POSITIVE
             while charging, NEGATIVE while discharging. If your Solar
             Assistant sensor is the opposite, change "+ battery" to
             "- battery" above. See README sanity check to confirm which way
             yours reads. #}

      # Whole-home instantaneous usage = direct (non-backed-up) grid load
      # + whatever the inverter is actually delivering to backed-up loads.
      - name: "Whole Home Power"
        unique_id: whole_home_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set grid_total = states('sensor.dte_instantaneous_demand') | float(0) %}
          {% set grid_in = states('sensor.grid_into_inverter_power') | float(0) %}
          {% set load_out = states('sensor.inverter_output_power') | float(0) %}
          {{ [0, grid_total - grid_in + load_out] | max | round(0) }}

      # Power actually offsetting the grid right now (what backed-up loads
      # are drawing that did NOT come from the grid). This is the basis for
      # "kWh saved" and "$ saved" - it nets out battery cycling automatically.
      - name: "Grid Offset Power"
        unique_id: grid_offset_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set load_out = states('sensor.inverter_output_power') | float(0) %}
          {% set grid_in = states('sensor.grid_into_inverter_power') | float(0) %}
          {{ [0, load_out - grid_in] | max | round(0) }}

      # Current applicable rate, purely informational (shown on the
      # dashboard) - mirrors the same seasonal peak-rate logic used below.
      - name: "Current Electricity Rate"
        unique_id: current_electricity_rate
        unit_of_measurement: "$/kWh"
        icon: mdi:cash-clock
        state_class: measurement
        state: >
          {% set is_peak_window = now().weekday() < 5 and 15 <= now().hour < 19 %}
          {% set is_summer = 6 <= now().month <= 9 %}
          {% if is_peak_window %}
            {{ 0.2413 if is_summer else 0.2005 }}
          {% else %}
            {{ 0.1844 }}
          {% endif %}

      # Cost sensors. Combine today's peak/off-peak kWh (from the
      # utility_meter tariffs below) with DTE's published rates - see the
      # header comment for the source and how to update if rates change.
      # Peak rate is season-dependent (summer Jun-Sep vs. non-summer); the
      # value used is whatever season it is at the moment this template
      # evaluates, which is fine since these are daily-reset "today" totals
      # and DTE's season boundaries don't fall mid-day.
      - name: "Energy Cost Today"
        unique_id: energy_cost_today
        unit_of_measurement: "$"
        icon: mdi:currency-usd
        state_class: measurement
        state: >
          {% set peak_kwh = states('sensor.grid_import_daily_peak') | float(0) %}
          {% set offpeak_kwh = states('sensor.grid_import_daily_offpeak') | float(0) %}
          {% set rate_peak = 0.2413 if (6 <= now().month <= 9) else 0.2005 %}
          {% set rate_offpeak = 0.1844 %}
          {{ ((peak_kwh * rate_peak) + (offpeak_kwh * rate_offpeak)) | round(2) }}

      - name: "Solar Savings Today"
        unique_id: solar_savings_today
        unit_of_measurement: "$"
        icon: mdi:piggy-bank
        state_class: measurement
        state: >
          {% set peak_kwh = states('sensor.grid_offset_daily_peak') | float(0) %}
          {% set offpeak_kwh = states('sensor.grid_offset_daily_offpeak') | float(0) %}
          {% set rate_peak = 0.2413 if (6 <= now().month <= 9) else 0.2005 %}
          {% set rate_offpeak = 0.1844 %}
          {{ ((peak_kwh * rate_peak) + (offpeak_kwh * rate_offpeak)) | round(2) }}

# -----------------------------------------------------------------------------
# Energy sensors (kWh, monotonically increasing) - integrate the power
# sensors above so utility_meter has something to reset daily.
# -----------------------------------------------------------------------------
sensor:
  - platform: integration
    name: Solar Production Energy
    unique_id: solar_production_energy
    source: sensor.solar_production_power
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    name: Whole Home Usage Energy
    unique_id: whole_home_usage_energy
    source: sensor.whole_home_power
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    name: Grid Offset Energy
    unique_id: grid_offset_energy
    source: sensor.grid_offset_power
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    name: Grid Import Energy
    unique_id: grid_import_energy
    source: sensor.dte_instantaneous_demand
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

# -----------------------------------------------------------------------------
# Daily totals. Each metric gets a plain daily total, and the two that feed
# cost math (grid import, grid offset) also get a peak/off-peak split via
# utility_meter "tariffs" so TOU rates can be applied correctly below.
# -----------------------------------------------------------------------------
utility_meter:
  solar_production_daily:
    source: sensor.solar_production_energy
    cycle: daily

  whole_home_usage_daily:
    source: sensor.whole_home_usage_energy
    cycle: daily

  grid_import_daily_total:
    source: sensor.grid_import_energy
    cycle: daily

  grid_import_daily:
    source: sensor.grid_import_energy
    cycle: daily
    tariffs:
      - peak
      - offpeak

  grid_offset_daily_total:
    source: sensor.grid_offset_energy
    cycle: daily

  grid_offset_daily:
    source: sensor.grid_offset_energy
    cycle: daily
    tariffs:
      - peak
      - offpeak

# -----------------------------------------------------------------------------
# Automations: flip the utility_meter tariff selectors at DTE's published
# peak window (Mon-Fri 3pm-7pm). Peak only applies Mon-Fri; weekends stay
# off-peak all day since the "switch to peak" automation never fires on
# Sat/Sun. If DTE changes this window, update the "at:" times below.
# -----------------------------------------------------------------------------
automation:
  - alias: "Solar Dashboard - Switch to Peak Rate"
    id: solar_dashboard_switch_peak
    trigger:
      - platform: time
        at: "15:00:00"
    condition:
      - condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
    action:
      - service: select.select_option
        target:
          entity_id:
            - select.grid_import_daily
            - select.grid_offset_daily
        data:
          option: peak

  - alias: "Solar Dashboard - Switch to Off-Peak Rate"
    id: solar_dashboard_switch_offpeak
    trigger:
      - platform: time
        at: "19:00:00"
      - platform: time
        at: "00:00:00"
    action:
      - service: select.select_option
        target:
          entity_id:
            - select.grid_import_daily
            - select.grid_offset_daily
        data:
          option: offpeak
