# =============================================================================
# Solar / Off-Grid Inverter Energy Dashboard — Home Assistant package
# =============================================================================
#
# WHY THIS EXISTS
# ----------------
# The off-grid inverter has no communication interface, so solar production
# is never measured directly. This package derives it (and every other
# dashboard metric) from three real sensors:
#
#   1. Solar Assistant  -> battery power (signed: + = charging, - = discharging)
#   2. Fusion Energy CTs -> inverter output power (to the 100A backed-up panel)
#                        -> grid input power (into the inverter, for charging
#                           / pass-through)
#   3. DTE Energy Bridge -> total grid import power (the whole house, as seen
#                           by the utility meter)
#
# The energy-balance identity at the inverter's DC bus is:
#
#     solar_in + grid_in = load_out + battery_charge - battery_discharge
#
# Rearranged, solar production is whatever is left over:
#
#     solar_production = load_out + battery_power(signed) - grid_into_inverter
#
# See ../README.md for the full explanation, required CT clamp placement,
# and a sanity-check procedure. SEM-METER, Solar Assistant, and DTE Energy
# Bridge entity IDs below are wired to real entities. The DTE Bridge reaches
# HA via a Mosquitto bridge connection (see ../mosquitto/dte_bridge.conf and
# the README's "DTE Energy Bridge" section) rather than any native
# integration - DTE's v2 hardware has none.
#
# The DTE Bridge measures at the utility meter, upstream of a garage that
# taps off the service before the main panel - it's the only sensor in this
# system that captures that garage load, which is why it's used here
# instead of the SEM-METER's own main-panel CTs.
#
# ELECTRICITY RATES are hardcoded below from the user's actual DTE rate
# plan (corrected 2026-08-07, supersedes an earlier wrong plan). Peak
# window is Mon-Fri 11am-7pm; weekends are off-peak all day. BOTH the peak
# and off-peak rates are season-dependent (unlike the previous plan, where
# off-peak was flat year-round). If DTE revises these rates, update the
# numbers in "Current Electricity Rate" / "Energy Cost Today" /
# "Solar Savings Today" / "HVAC Cost Today" below, and the automation
# trigger times if the peak window itself changes.
#
#   Summer (Jun 1 - Oct 31, Mon-Fri):
#     Off-Peak: 15.18 cents/kWh
#     Peak (11am-7pm): 25.93 cents/kWh
#   Non-summer (Nov 1 - May 31, Mon-Fri):
#     Off-Peak: 14.97 cents/kWh
#     Peak (11am-7pm): 23.41 cents/kWh
#   Weekends: off-peak all day, both seasons.
# =============================================================================

# -----------------------------------------------------------------------------
# DTE Energy Bridge v2 sensors used to live here as this package's own
# top-level `mqtt:` key, reached via the Mosquitto bridge in
# ../mosquitto/dte_bridge.conf. That broke once configuration.yaml also
# defined its own top-level `mqtt:` key for the SEM-METER: having `mqtt:`
# defined in both configuration.yaml AND a package does NOT merge safely
# in practice - one silently wins and the other's entities stop being
# created (confirmed by "This entity is no longer being provided by the
# mqtt integration" in the UI). Both DTE sensors now live in
# ../sem-meter/mqtt_sensors_combined.yaml instead, merged into the SAME mqtt:
# sensor: list as the SEM-METER sensors in the user's configuration.yaml -
# see that file and the README for the reasoning and current content.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Power sensors (instantaneous, Watts) - combine raw CT channels into the
# four quantities the rest of this file needs.
# -----------------------------------------------------------------------------
template:
  - sensor:
      # Sum of both legs of the CT pair clamped on the wires between the
      # inverter and the 100A backed-up panel.
      - name: "Inverter Output Power"
        unique_id: inverter_output_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.inverter_out_l1_active_power') | float(0))
             + (states('sensor.inverter_out_l2_active_power') | float(0)) }}

      # Sum of both legs of the CT pair clamped on the 240V breaker feeding
      # the inverter from the main panel (grid power going INTO the inverter).
      - name: "Grid Into Inverter Power"
        unique_id: grid_into_inverter_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.inverter_in_l1_active_power') | float(0))
             + (states('sensor.inverter_in_l2_active_power') | float(0)) }}

      # Estimated real-time solar production, derived from the energy
      # balance. Clamped at 0 to absorb sensor noise around idle.
      - name: "Solar Production Power"
        unique_id: solar_production_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set load_out = states('sensor.inverter_output_power') | float(0) %}
          {% set battery = states('sensor.totals_battery_power') | float(0) %}
          {% set grid_in = states('sensor.grid_into_inverter_power') | float(0) %}
          {{ [0, load_out + battery - grid_in] | max | round(0) }}
          {# Sign convention assumed: sensor.totals_battery_power is POSITIVE
             while charging, NEGATIVE while discharging. If your Solar
             Assistant sensor is the opposite, change "+ battery" to
             "- battery" above. See README sanity check to confirm which way
             yours reads. #}

      # Whole-home instantaneous usage = direct (non-backed-up) grid load
      # + whatever the inverter is actually delivering to backed-up loads.
      - name: "Whole Home Power"
        unique_id: whole_home_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set grid_total = states('sensor.dte_instantaneous_demand') | float(0) %}
          {% set grid_in = states('sensor.grid_into_inverter_power') | float(0) %}
          {% set load_out = states('sensor.inverter_output_power') | float(0) %}
          {{ [0, grid_total - grid_in + load_out] | max | round(0) }}

      # Power actually offsetting the grid right now (what backed-up loads
      # are drawing that did NOT come from the grid). This is the basis for
      # "kWh saved" and "$ saved" - it nets out battery cycling automatically.
      - name: "Grid Offset Power"
        unique_id: grid_offset_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set load_out = states('sensor.inverter_output_power') | float(0) %}
          {% set grid_in = states('sensor.grid_into_inverter_power') | float(0) %}
          {{ [0, load_out - grid_in] | max | round(0) }}

      # Barn = two 120V feeds metered directly by SEM-METER CT channels.
      - name: "Barn Power"
        unique_id: barn_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.barn_l1_active_power') | float(0))
             + (states('sensor.barn_l2_active_power') | float(0)) }}

      # DTE Bridge cancellation validation. The utility service splits at
      # the meter into exactly two paths - the main panel (metered by the
      # SEM-METER's own "Main circuit" CTs) and the barn/garage (metered by
      # Barn L1/L2) - so summing them should reconstruct the same total the
      # DTE Bridge reads directly at the meter. See the daily kWh delta
      # sensors below for the reliable version of this check (this
      # instantaneous one is just a quick sanity glance, noisy point to
      # point since Main/Barn and DTE update on different schedules).
      - name: "Reconstructed Grid Total Power"
        unique_id: reconstructed_grid_total_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.main_circuit_active_power') | float(0))
             + (states('sensor.barn_power') | float(0)) }}

      - name: "Grid Total Delta Power"
        unique_id: grid_total_delta_power
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:delta
        state: >
          {% set reconstructed = states('sensor.reconstructed_grid_total_power') | float(0) %}
          {% set dte = states('sensor.dte_instantaneous_demand') | float(0) %}
          {{ (reconstructed - dte) | round(0) }}

      # The reliable version of the check above - full-day kWh totals
      # average out CT timing/quantization noise that makes the
      # instantaneous comparison jump around. Watch this across several
      # days (ideally spanning both sunny and cloudy days, since the
      # inverter's behavior differs) before trusting it enough to return
      # the DTE Bridge - a single day isn't enough to rule out a real gap
      # that just happened to be small that day.
      - name: "Grid Total Delta Daily"
        unique_id: grid_total_delta_daily
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:delta
        state: >
          {% set reconstructed = states('sensor.reconstructed_grid_total_daily') | float(0) %}
          {% set dte = states('sensor.grid_import_daily_total') | float(0) %}
          {{ (reconstructed - dte) | round(3) }}

      - name: "Grid Total Delta Daily Percent"
        unique_id: grid_total_delta_daily_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:delta
        state: >
          {% set reconstructed = states('sensor.reconstructed_grid_total_daily') | float(0) %}
          {% set dte = states('sensor.grid_import_daily_total') | float(0) %}
          {% if dte > 0 %}
            {{ (((reconstructed - dte) / dte) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}

      # HVAC = condenser/compressor + air handler blower, both metered
      # directly by SEM-METER CT channels.
      - name: "HVAC Power"
        unique_id: hvac_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.a_c_active_power') | float(0))
             + (states('sensor.hvac_blower_active_power') | float(0)) }}

      # Current applicable rate, purely informational (shown on the
      # dashboard) - mirrors the same seasonal peak-rate logic used below.
      - name: "Current Electricity Rate"
        unique_id: current_electricity_rate
        unit_of_measurement: "$/kWh"
        icon: mdi:cash-clock
        state_class: measurement
        state: >
          {% set is_peak_window = now().weekday() < 5 and 11 <= now().hour < 19 %}
          {% set is_summer = 6 <= now().month <= 10 %}
          {% if is_peak_window %}
            {{ 0.2593 if is_summer else 0.2341 }}
          {% else %}
            {{ 0.1518 if is_summer else 0.1497 }}
          {% endif %}

      # Cost sensors. Combine today's peak/off-peak kWh (from the
      # utility_meter tariffs below) with the user's DTE rate plan - see
      # the header comment for the source and how to update if rates
      # change. Both peak and off-peak rates are season-dependent (summer
      # Jun-Oct vs. non-summer); the value used is whatever season it is
      # at the moment this template evaluates, which is fine since these
      # are daily-reset "today" totals and DTE's season boundaries don't
      # fall mid-day.
      - name: "Energy Cost Today"
        unique_id: energy_cost_today
        unit_of_measurement: "$"
        icon: mdi:currency-usd
        state_class: measurement
        state: >
          {% set peak_kwh = states('sensor.grid_import_daily_peak') | float(0) %}
          {% set offpeak_kwh = states('sensor.grid_import_daily_offpeak') | float(0) %}
          {% set is_summer = 6 <= now().month <= 10 %}
          {% set rate_peak = 0.2593 if is_summer else 0.2341 %}
          {% set rate_offpeak = 0.1518 if is_summer else 0.1497 %}
          {{ ((peak_kwh * rate_peak) + (offpeak_kwh * rate_offpeak)) | round(2) }}

      - name: "Solar Savings Today"
        unique_id: solar_savings_today
        unit_of_measurement: "$"
        icon: mdi:piggy-bank
        state_class: measurement
        state: >
          {% set peak_kwh = states('sensor.grid_offset_daily_peak') | float(0) %}
          {% set offpeak_kwh = states('sensor.grid_offset_daily_offpeak') | float(0) %}
          {% set is_summer = 6 <= now().month <= 10 %}
          {% set rate_peak = 0.2593 if is_summer else 0.2341 %}
          {% set rate_offpeak = 0.1518 if is_summer else 0.1497 %}
          {{ ((peak_kwh * rate_peak) + (offpeak_kwh * rate_offpeak)) | round(2) }}

      - name: "HVAC Cost Today"
        unique_id: hvac_cost_today
        unit_of_measurement: "$"
        icon: mdi:hvac
        state_class: measurement
        state: >
          {% set peak_kwh = states('sensor.hvac_usage_daily_peak') | float(0) %}
          {% set offpeak_kwh = states('sensor.hvac_usage_daily_offpeak') | float(0) %}
          {% set is_summer = 6 <= now().month <= 10 %}
          {% set rate_peak = 0.2593 if is_summer else 0.2341 %}
          {% set rate_offpeak = 0.1518 if is_summer else 0.1497 %}
          {{ ((peak_kwh * rate_peak) + (offpeak_kwh * rate_offpeak)) | round(2) }}

      # Compares today's running total against yesterday's final total,
      # using the utility_meter's built-in `last_period` attribute (the
      # value it held at the last daily reset) - no extra history lookups
      # needed. Before the very first midnight reset after installing this
      # package, last_period is empty and this reads 0%, which is a
      # display artifact (no prior day to compare against yet), not a real
      # "no change" reading. Also note this compares a full previous day
      # against a still-in-progress current day, so it's most meaningful
      # checked late in the day / after the daily summary export fires.
      - name: "Whole Home Usage vs Yesterday"
        unique_id: whole_home_usage_vs_yesterday
        unit_of_measurement: "%"
        state_class: measurement
        icon: >
          {% set yesterday = state_attr('sensor.whole_home_usage_daily', 'last_period') | float(0) %}
          {% set today = states('sensor.whole_home_usage_daily') | float(0) %}
          {% if yesterday <= 0 %}
            mdi:calendar-question
          {% elif today > yesterday %}
            mdi:trending-up
          {% elif today < yesterday %}
            mdi:trending-down
          {% else %}
            mdi:trending-neutral
          {% endif %}
        state: >
          {% set yesterday = state_attr('sensor.whole_home_usage_daily', 'last_period') | float(0) %}
          {% set today = states('sensor.whole_home_usage_daily') | float(0) %}
          {% if yesterday > 0 %}
            {{ (((today - yesterday) / yesterday) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}

      # Service neutral: the stranded conductor is split across two CTs
      # (SEM-METER channels 13/14), so the halves are summed. The strands
      # carry in-phase current, so adding RMS magnitudes is valid here.
      - name: "Service Neutral Current"
        unique_id: service_neutral_current
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        state: >
          {{ ((states('sensor.service_neutral_a_current') | float(0))
             + (states('sensor.service_neutral_b_current') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.service_neutral_a_current')
             and has_value('sensor.service_neutral_b_current') }}

      # Ground conductor topology (series, NOT parallel paths - don't sum):
      #
      #   main panel ground bus --[CT15 Main Panel Ground Out]--> junction J
      #   J --> inverter chassis ground
      #   J --[CT16 Inverter Panel Ground Out]--> sub-panel ground bus
      #   J --> house ground out --> union U --> ground rod
      #   U --> barn 100A disconnect ground (disconnect is N-G bonded)
      #
      # The house main panel and the barn disconnect are both service
      # disconnects fed from the meter box, each N-G bonded, so their
      # tied grounds form a loop with the two neutrals:
      #
      #   meter N --[house service neutral, CT13/14]--> house N bar
      #   house N bar --bond--> CT15 --> J --> U --> barn disconnect
      #   barn disconnect --bond--> barn disconnect N --> meter N
      #
      # House return current splits between the service neutral and that
      # loop by resistance. Handheld clamp: nothing at the ground rod, all
      # of it continues from U into the barn disconnect ground. The
      # inverter AC input (L1/L2 and N lifted) had no effect.
      #
      # Sub-panel neutral is not bonded to ground. KCL at J gives
      # |I15 - I16| as a lower bound on what leaves J for the house ground
      # out plus the inverter chassis branch (neither has a CT); in
      # practice it is the current headed to the barn disconnect.
      - name: "Inverter Chassis Ground Current"
        unique_id: inverter_chassis_ground_current
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        state: >
          {{ ((states('sensor.main_panel_ground_out_current') | float(0))
             - (states('sensor.inverter_panel_ground_out_current') | float(0))) | abs | round(2) }}
        availability: >
          {{ has_value('sensor.main_panel_ground_out_current')
             and has_value('sensor.inverter_panel_ground_out_current') }}

      # Total house return current: service neutral (CT13/14) plus the
      # share taking the ground loop to the barn disconnect (CT15). Both
      # branches of a resistive divider carry in-phase current, so adding
      # RMS magnitudes is a fair approximation.
      - name: "House Neutral Return Current"
        unique_id: house_neutral_return_current
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        state: >
          {{ ((states('sensor.service_neutral_current') | float(0))
             + (states('sensor.main_panel_ground_out_current') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.service_neutral_current')
             and has_value('sensor.main_panel_ground_out_current') }}

      # Share of the house return current taking the ground loop instead
      # of the service neutral: CT15 / (CT13+14 + CT15). A sound service
      # neutral keeps this in single digits. Reads 0 when house return is
      # under 0.1 A (ratio is just CT noise).
      - name: "Ground Return Share"
        unique_id: ground_return_share
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:scale-unbalanced
        state: >
          {% set t = states('sensor.house_neutral_return_current') | float(0) %}
          {% set g = states('sensor.main_panel_ground_out_current') | float(0) %}
          {{ ((g / t) * 100) | round(1) if t >= 0.1 else 0 }}
        availability: >
          {{ has_value('sensor.house_neutral_return_current')
             and has_value('sensor.main_panel_ground_out_current') }}
        attributes:
          sub_panel_share: >
            {% set t = states('sensor.house_neutral_return_current') | float(0) %}
            {% set g = states('sensor.inverter_panel_ground_out_current') | float(0) %}
            {{ ((g / t) * 100) | round(1) if t >= 0.1 else 0 }}
          inverter_chassis_share: >
            {% set t = states('sensor.house_neutral_return_current') | float(0) %}
            {% set g = states('sensor.inverter_chassis_ground_current') | float(0) %}
            {{ ((g / t) * 100) | round(1) if t >= 0.1 else 0 }}

      # CT15 / CT13+14. Current divides inversely to resistance, so this is
      # R(service neutral) / R(ground loop via the barn disconnect). It
      # stays flat under any load; a healthy aluminium service neutral
      # should make it a few hundredths. A high value means the service
      # neutral (most likely a lug at the meter box or main panel) has
      # high resistance. Reads 0 when service neutral is under 0.1 A.
      - name: "Neutral to Ground Path Ratio"
        unique_id: neutral_ground_path_ratio
        state_class: measurement
        icon: mdi:division
        state: >
          {% set n = states('sensor.service_neutral_current') | float(0) %}
          {% set g = states('sensor.main_panel_ground_out_current') | float(0) %}
          {{ (g / n) | round(2) if n >= 0.1 else 0 }}
        availability: >
          {{ has_value('sensor.service_neutral_current')
             and has_value('sensor.main_panel_ground_out_current') }}

      # Minimum neutral current from main-panel leg imbalance. For 120V
      # loads at the same power factor the return is |I_L1 - I_L2|; loads
      # at different power factors make the phasor difference larger, so
      # this is a lower bound, not a prediction. 240V loads cancel out.
      # The main CTs, service neutral CTs and CT15 are all on the house
      # side, so the barn is correctly left out.
      - name: "Expected Neutral Current"
        unique_id: expected_neutral_current
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:scale-balance
        state: >
          {{ ((states('sensor.main_l1_current') | float(0))
             - (states('sensor.main_l2_current') | float(0))) | abs | round(2) }}
        availability: >
          {{ has_value('sensor.main_l1_current')
             and has_value('sensor.main_l2_current') }}

      # Minimum expected minus measured house return (neutral + ground
      # loop). Since expected is a lower bound, this is normally negative;
      # a positive value is current leaving by a path with no CT at all
      # (earth via the ground rod, a water pipe, a neighbour's service).
      - name: "Neutral Shortfall"
        unique_id: neutral_shortfall
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:delta
        state: >
          {{ ((states('sensor.expected_neutral_current') | float(0))
             - (states('sensor.house_neutral_return_current') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.expected_neutral_current')
             and has_value('sensor.house_neutral_return_current') }}

      # Shortfall as % of expected. Reads 0 when expected neutral current
      # is under 0.5 A (balanced legs make the ratio meaningless).
      - name: "Neutral Shortfall Percent"
        unique_id: neutral_shortfall_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:delta
        state: >
          {% set e = states('sensor.expected_neutral_current') | float(0) %}
          {% set d = states('sensor.neutral_shortfall') | float(0) %}
          {{ ((d / e) * 100) | round(1) if e >= 0.5 else 0 }}
        availability: >
          {{ has_value('sensor.expected_neutral_current')
             and has_value('sensor.neutral_shortfall') }}

      # Barn neutral check (SEM-METER channel 12 on the barn feeder neutral).
      # The barn's own load should put |Barn L1 - Barn L2| on its neutral.
      # Excess = measured - expected. Positive = extra current on the barn
      # neutral that isn't the barn's: house return current crossing the
      # barn disconnect's N-G bond from the ground loop and riding the
      # barn neutral back to the meter box. If the clamp is on the meter
      # box to disconnect neutral, the excess should track CT15.
      - name: "Barn Expected Neutral Current"
        unique_id: barn_expected_neutral_current
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:scale-balance
        state: >
          {{ ((states('sensor.barn_l1_current') | float(0))
             - (states('sensor.barn_l2_current') | float(0))) | abs | round(2) }}
        availability: >
          {{ has_value('sensor.barn_l1_current')
             and has_value('sensor.barn_l2_current') }}

      - name: "Barn Neutral Excess"
        unique_id: barn_neutral_excess
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:delta
        state: >
          {{ ((states('sensor.barn_neutral_current') | float(0))
             - (states('sensor.barn_expected_neutral_current') | float(0))) | round(2) }}
        availability: >
          {{ has_value('sensor.barn_neutral_current')
             and has_value('sensor.barn_expected_neutral_current') }}

# -----------------------------------------------------------------------------
# Energy sensors (kWh, monotonically increasing) - integrate the power
# sensors above so utility_meter has something to reset daily.
# -----------------------------------------------------------------------------
sensor:
  - platform: integration
    name: Solar Production Energy
    unique_id: solar_production_energy
    source: sensor.solar_production_power
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    name: Whole Home Usage Energy
    unique_id: whole_home_usage_energy
    source: sensor.whole_home_power
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    name: Grid Offset Energy
    unique_id: grid_offset_energy
    source: sensor.grid_offset_power
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    name: Grid Import Energy
    unique_id: grid_import_energy
    source: sensor.dte_instantaneous_demand
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    name: HVAC Energy
    unique_id: hvac_energy
    source: sensor.hvac_power
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    name: Reconstructed Grid Total Energy
    unique_id: reconstructed_grid_total_energy
    source: sensor.reconstructed_grid_total_power
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

# -----------------------------------------------------------------------------
# Daily totals. Each metric gets a plain daily total, and the two that feed
# cost math (grid import, grid offset) also get a peak/off-peak split via
# utility_meter "tariffs" so TOU rates can be applied correctly below.
# -----------------------------------------------------------------------------
utility_meter:
  solar_production_daily:
    source: sensor.solar_production_energy
    cycle: daily

  whole_home_usage_daily:
    source: sensor.whole_home_usage_energy
    cycle: daily

  grid_import_daily_total:
    source: sensor.grid_import_energy
    cycle: daily

  grid_import_daily:
    source: sensor.grid_import_energy
    cycle: daily
    tariffs:
      - peak
      - offpeak

  grid_offset_daily_total:
    source: sensor.grid_offset_energy
    cycle: daily

  grid_offset_daily:
    source: sensor.grid_offset_energy
    cycle: daily
    tariffs:
      - peak
      - offpeak

  hvac_usage_daily_total:
    source: sensor.hvac_energy
    cycle: daily

  hvac_usage_daily:
    source: sensor.hvac_energy
    cycle: daily
    tariffs:
      - peak
      - offpeak

  reconstructed_grid_total_daily:
    source: sensor.reconstructed_grid_total_energy
    cycle: daily

# -----------------------------------------------------------------------------
# Automations: flip the utility_meter tariff selectors at the plan's peak
# window (Mon-Fri 11am-7pm). Peak only applies Mon-Fri; weekends stay
# off-peak all day since the "switch to peak" automation never fires on
# Sat/Sun. If DTE changes this window, update the "at:" times below.
# -----------------------------------------------------------------------------
automation:
  - alias: "Solar Dashboard - Switch to Peak Rate"
    id: solar_dashboard_switch_peak
    trigger:
      - platform: time
        at: "11:00:00"
    condition:
      - condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
    action:
      - service: select.select_option
        target:
          entity_id:
            - select.grid_import_daily
            - select.grid_offset_daily
            - select.hvac_usage_daily
        data:
          option: peak

  - alias: "Solar Dashboard - Switch to Off-Peak Rate"
    id: solar_dashboard_switch_offpeak
    trigger:
      - platform: time
        at: "19:00:00"
      - platform: time
        at: "00:00:00"
    action:
      - service: select.select_option
        target:
          entity_id:
            - select.grid_import_daily
            - select.grid_offset_daily
            - select.hvac_usage_daily
        data:
          option: offpeak

  # Fires 1 minute before the utility_meter daily reset at midnight, so it
  # captures the full day's final totals. Posts as a persistent
  # notification (Settings > Notifications, or the bell icon) - copy/paste
  # the text out to share it for review. Each day gets its own
  # notification_id (date-stamped) so they don't overwrite each other;
  # dismiss old ones manually whenever you like.
  - alias: "Solar Dashboard - Daily Summary Export"
    id: solar_dashboard_daily_summary
    trigger:
      - platform: time
        at: "23:59:00"
    action:
      - service: persistent_notification.create
        data:
          notification_id: "solar_dashboard_summary_{{ now().strftime('%Y%m%d') }}"
          title: "Solar Dashboard Summary - {{ now().strftime('%Y-%m-%d') }}"
          message: >
            Solar Production: {{ states('sensor.solar_production_daily') }} kWh

            Whole Home Usage: {{ states('sensor.whole_home_usage_daily') }} kWh

            Grid Import - Total: {{ states('sensor.grid_import_daily_total') }} kWh
            Grid Import - Peak: {{ states('sensor.grid_import_daily_peak') }} kWh
            Grid Import - Off-Peak: {{ states('sensor.grid_import_daily_offpeak') }} kWh

            kWh Saved - Total: {{ states('sensor.grid_offset_daily_total') }} kWh
            kWh Saved - Peak: {{ states('sensor.grid_offset_daily_peak') }} kWh
            kWh Saved - Off-Peak: {{ states('sensor.grid_offset_daily_offpeak') }} kWh

            Energy Cost Today: ${{ states('sensor.energy_cost_today') }}
            Solar Savings Today: ${{ states('sensor.solar_savings_today') }}

            HVAC Usage Today: {{ states('sensor.hvac_usage_daily_total') }} kWh
            HVAC Cost Today: ${{ states('sensor.hvac_cost_today') }}

            DTE Bridge Validation - Reconstructed Grid Total (Main + Barn): {{ states('sensor.reconstructed_grid_total_daily') }} kWh
            DTE Bridge Validation - DTE Meter Total: {{ states('sensor.grid_import_daily_total') }} kWh
            DTE Bridge Validation - Delta: {{ states('sensor.grid_total_delta_daily') }} kWh ({{ states('sensor.grid_total_delta_daily_percent') }}%)

            Battery SOC (at report time): {{ states('sensor.totals_battery_state_of_charge') }}%
            Current Electricity Rate (at report time): ${{ states('sensor.current_electricity_rate') }}/kWh

  # Ground-share alert. With the house main and barn disconnect both
  # bonded, CT15 always carries a fixed slice of the house return current
  # (~3-7% after the 2026-10-23 neutral repair, ~42% with the fault), so a
  # fixed amp threshold false-alarms on any big 120V load. This fires on
  # sensor.ground_return_share instead: above
  # input_number.ground_share_alert_threshold for 1 minute, but only while
  # house return current is at least input_number.ground_share_alert_min_current
  # (the share is just CT noise at idle). "Back to normal" needs the share
  # below threshold for 1 minute under the same load floor, and is only
  # sent after a HIGH, tracked by input_boolean.ground_share_alert_active,
  # so a restart or a meter dropout can't produce a stray message. Turn off
  # input_boolean.ground_current_alerts to silence it.
  - alias: "Ground Current Alert"
    id: ground_current_alert
    mode: queued
    trigger:
      - platform: template
        value_template: >
          {{ has_value('sensor.ground_return_share')
             and states('sensor.house_neutral_return_current') | float(0)
                 >= states('input_number.ground_share_alert_min_current') | float(3)
             and states('sensor.ground_return_share') | float(0)
                 > states('input_number.ground_share_alert_threshold') | float(20) }}
        for:
          minutes: 1
        id: high
      - platform: template
        value_template: >
          {{ has_value('sensor.ground_return_share')
             and states('sensor.house_neutral_return_current') | float(0)
                 >= states('input_number.ground_share_alert_min_current') | float(3)
             and states('sensor.ground_return_share') | float(0)
                 <= states('input_number.ground_share_alert_threshold') | float(20) }}
        for:
          minutes: 1
        id: normal
    condition:
      - condition: state
        entity_id: input_boolean.ground_current_alerts
        state: "on"
      - condition: template
        value_template: >
          {{ (trigger.id == 'high' and is_state('input_boolean.ground_share_alert_active', 'off'))
             or (trigger.id == 'normal' and is_state('input_boolean.ground_share_alert_active', 'on')) }}
    variables:
      title: >-
        {{ 'Ground share HIGH' if trigger.id == 'high' else 'Ground share back to normal' }}
      message: >-
        {{ states('sensor.ground_return_share') }}% of house return on ground
        (threshold {{ states('input_number.ground_share_alert_threshold') | float(20) | round(0) }}%)
        at {{ now().strftime('%H:%M:%S') }}.
        Neutral {{ states('sensor.service_neutral_current') }} A,
        CT15 {{ states('sensor.main_panel_ground_out_current') }} A,
        CT16 {{ states('sensor.inverter_panel_ground_out_current') }} A.
    action:
      - service: "input_boolean.turn_{{ 'on' if trigger.id == 'high' else 'off' }}"
        target:
          entity_id: input_boolean.ground_share_alert_active
      - service: persistent_notification.create
        data:
          notification_id: ground_share_alert
          title: "{{ title }}"
          message: "{{ message }}"
      # Push to Matt's phone. The tag makes the "normal" message replace
      # the "high" one on the phone instead of stacking.
      - service: notify.mobile_app_matt_s_phone
        continue_on_error: true
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            tag: ground_share_alert

# -----------------------------------------------------------------------------
# Ground-fault hunt note. Type what you just changed (e.g. "Main #14 OFF")
# from the Ground Fault Hunt dashboard view. Its history shows up as a
# labelled timeline bar directly above the ground-current graphs, so each
# dip or jump lines up with the breaker you flipped.
# -----------------------------------------------------------------------------
input_text:
  ground_hunt_note:
    name: Ground Hunt Note
    max: 100
    icon: mdi:note-edit-outline

# Share threshold, load floor and on/off switch for the Ground Current
# Alert automation above. All set from the Ground Fault Hunt dashboard view.
input_number:
  ground_share_alert_threshold:
    name: Ground Share Alert Threshold
    min: 5
    max: 100
    step: 1
    initial: 20
    unit_of_measurement: "%"
    mode: box
    icon: mdi:alert-circle-outline

  ground_share_alert_min_current:
    name: Ground Share Alert Min Return Current
    min: 0.5
    max: 50
    step: 0.5
    initial: 3
    unit_of_measurement: A
    mode: box
    icon: mdi:current-ac

input_boolean:
  ground_current_alerts:
    name: Ground Current Alerts
    initial: true
    icon: mdi:bell-alert

  # Set by the alert automation while a HIGH is outstanding. No initial
  # value so it survives restarts.
  ground_share_alert_active:
    name: Ground Share Alert Active
    icon: mdi:alert
