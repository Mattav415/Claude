# =============================================================================
# Mosquitto bridge config - connects your HA Mosquitto broker out to the
# DTE Energy Bridge v2's own local MQTT broker and mirrors its metering
# topics in. This is NOT an HA package file - it must be dropped into the
# Mosquitto add-on's customize folder (see ../README.md "DTE Energy Bridge"
# section for install steps), not config/packages/.
#
# CHANGE ME: verify the bridge's current local IP before using this - it may
# have changed since this was last working (router DHCP lease, reboot,
# etc). Check your router's connected-devices list for "Powerley" /
# "EnergyBridge" / similar, or scan the LAN for something listening on
# port 2883.
# =============================================================================
connection dte
address 192.168.1.170:2883
clientid client-1
try_private false
start_type automatic
topic event/metering/# in 0
