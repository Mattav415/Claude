# =============================================================================
# Solar Dashboard - Lovelace view
# Uses only built-in HA card types (tile, gauge, statistics-graph, entities) -
# no HACS/custom cards required.
#
# Import: Settings > Dashboards > Add Dashboard > "Take control" of a new
# dashboard, then edit in YAML mode and paste this in (or add as a new
# `views:` entry to an existing dashboard).
# =============================================================================
title: Solar
views:
  - title: Solar
    path: solar
    icon: mdi:solar-power
    cards:
      - type: heading
        heading: Right Now
        heading_style: title

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.solar_production_power
            name: Solar Production
            unit: W
            min: 0
            max: 2640 # CHANGE ME - set to your array's rated output in watts
            severity:
              green: 1
              yellow: 0
              red: 0

          - type: gauge
            entity: sensor.whole_home_power
            name: Whole Home Usage
            unit: W
            min: 0
            max: 10000 # CHANGE ME - set to a sensible ceiling for your home
            severity:
              green: 0
              yellow: 5000
              red: 8000

          - type: gauge
            entity: sensor.totals_battery_state_of_charge
            name: Battery
            unit: "%"
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 20
              green: 50

      - type: grid
        columns: 5
        square: false
        cards:
          - type: tile
            entity: sensor.dte_instantaneous_demand
            name: Total Grid Draw (DTE)
            icon: mdi:transmission-tower-import
          - type: tile
            entity: sensor.inverter_output_power
            name: Backed-Up Load
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.grid_into_inverter_power
            name: Grid Power to Inverter
            icon: mdi:power-plug
          - type: tile
            entity: sensor.totals_battery_power
            name: Battery Power
            icon: mdi:battery-charging-outline
          - type: tile
            entity: sensor.barn_power
            name: Barn Usage
            icon: mdi:barn

      - type: heading
        heading: Today
        heading_style: title

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: sensor.solar_production_daily
            name: Solar Production
            icon: mdi:solar-power-variant
            vertical: true

          - type: tile
            entity: sensor.whole_home_usage_daily
            name: Home Usage
            icon: mdi:home-lightning-bolt
            vertical: true

          - type: tile
            entity: sensor.grid_import_daily_total
            name: Grid Import
            icon: mdi:transmission-tower-import
            vertical: true

          - type: tile
            entity: sensor.grid_offset_daily_total
            name: kWh Saved
            icon: mdi:leaf
            color: green
            vertical: true

          - type: tile
            entity: sensor.energy_cost_today
            name: Energy Cost
            icon: mdi:currency-usd
            vertical: true

          - type: tile
            entity: sensor.solar_savings_today
            name: Saved via Solar
            icon: mdi:piggy-bank
            color: green
            vertical: true

          - type: tile
            entity: sensor.whole_home_usage_vs_yesterday
            name: Usage vs Yesterday
            vertical: true

      - type: heading
        heading: HVAC
        heading_style: title

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: sensor.hvac_power
            name: HVAC Power
            icon: mdi:hvac

          - type: tile
            entity: sensor.hvac_usage_daily_total
            name: HVAC Usage Today
            icon: mdi:lightning-bolt
            vertical: true

          - type: tile
            entity: sensor.hvac_cost_today
            name: HVAC Cost Today
            icon: mdi:currency-usd
            vertical: true

      - type: heading
        heading: DTE Bridge Validation
        heading_style: title

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.reconstructed_grid_total_daily
            name: Main + Barn Today
            icon: mdi:calculator
            vertical: true

          - type: tile
            entity: sensor.grid_import_daily_total
            name: DTE Meter Today
            icon: mdi:transmission-tower-import
            vertical: true

          - type: tile
            entity: sensor.grid_total_delta_daily
            name: Delta (kWh)
            icon: mdi:delta
            vertical: true

          - type: tile
            entity: sensor.grid_total_delta_daily_percent
            name: Delta (%)
            icon: mdi:delta
            vertical: true

      - type: heading
        heading: Trends
        heading_style: title

      - type: statistics-graph
        title: Power - Last 24 Hours
        entities:
          - sensor.solar_production_power
          - sensor.whole_home_power
          - sensor.inverter_output_power
          - sensor.grid_into_inverter_power
          - sensor.totals_battery_power
          - sensor.hvac_power
        stat_types:
          - mean
        days_to_show: 1
        period: hour

      - type: history-graph
        title: Daily Totals - Last 7 Days
        hours_to_show: 168
        entities:
          - sensor.solar_production_daily
          - sensor.whole_home_usage_daily
          - sensor.grid_offset_daily_total

      - type: heading
        heading: Rate Info
        heading_style: subtitle

      - type: entities
        entities:
          - entity: sensor.current_electricity_rate
            name: Current Rate
          - entity: select.grid_import_daily
            name: Current Tariff Period

  # ---------------------------------------------------------------------------
  # Ground Fault Hunt - live + historical current on the two grounding
  # conductor CTs (SEM-METER channels 15 and 16), for tracking down an open
  # neutral / neutral-to-ground fault circuit by circuit. Open this view on a
  # phone at the panel. Values update every time the SEM-METER publishes.
  # ---------------------------------------------------------------------------
  - title: Ground Fault Hunt
    path: ground-fault
    icon: mdi:current-ac
    cards:
      - type: heading
        heading: Ground Current - Live
        heading_style: title

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.main_panel_ground_out_current
            name: Main Panel Ground (CT15)
            unit: A
            min: 0
            max: 5 # CHANGE ME - set a bit above the highest reading you see
            needle: true
            severity:
              green: 0
              yellow: 0.5
              red: 1

          - type: gauge
            entity: sensor.inverter_panel_ground_out_current
            name: Sub-panel Ground (CT16)
            unit: A
            min: 0
            max: 5 # CHANGE ME - set a bit above the highest reading you see
            needle: true
            severity:
              green: 0
              yellow: 0.5
              red: 1

      - type: heading
        heading: Neutral vs Ground Balance
        heading_style: subtitle

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.ground_return_share
            name: House Return via Ground Loop
            unit: "%"
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 5
              red: 15

          - type: entities
            entities:
              - entity: sensor.service_neutral_current
                name: Service neutral (CT13+14)
              - entity: sensor.main_panel_ground_out_current
                name: Ground loop to barn disc. (CT15)
              - entity: sensor.house_neutral_return_current
                name: House return (neutral + ground)
              - entity: sensor.neutral_to_ground_path_ratio
                name: R(neutral) / R(ground loop)
              - entity: sensor.inverter_panel_ground_out_current
                name: Sub-panel ground (CT16)
              - entity: sensor.inverter_chassis_ground_current
                name: Out of junction J (min. est.)
              - type: section
                label: Leg imbalance check
              - entity: sensor.main_l1_current
                name: Main L1
              - entity: sensor.main_l2_current
                name: Main L2
              - entity: sensor.expected_neutral_current
                name: Minimum return |L1 - L2|
              - entity: sensor.neutral_shortfall
                name: Unaccounted (min - return)
              - entity: sensor.neutral_shortfall_percent
                name: Unaccounted (%)
              - entity: sensor.main_port_c_current
                name: Port C (should be ~0)
              - type: section
                label: Barn neutral check
              - entity: sensor.barn_neutral_current
                name: Barn neutral (ch 12)
              - entity: sensor.barn_expected_neutral_current
                name: Barn expected |L1 - L2|
              - entity: sensor.barn_neutral_excess
                name: Extra on barn neutral

      - type: entities
        title: What did you just change?
        entities:
          - entity: input_text.ground_hunt_note
            name: Note (e.g. "Main #14 OFF")
          - entity: input_boolean.ground_current_alerts
            name: Alerts enabled
          - entity: input_number.ground_share_alert_threshold
            name: Alert above ground share
          - entity: input_number.ground_share_alert_min_current
            name: Only when house return at least
          - entity: input_boolean.ground_share_alert_active
            name: Alert active

      - type: heading
        heading: History
        heading_style: title

      # Short window for breaker-by-breaker testing: flip one, watch the line.
      # The note timeline sits above the graph on the same time axis.
      - type: history-graph
        title: Last 30 Minutes
        hours_to_show: 0.5
        entities:
          - entity: input_text.ground_hunt_note
            name: Note
          - entity: sensor.main_panel_ground_out_current
            name: Main Panel Ground (CT15)
          - entity: sensor.inverter_panel_ground_out_current
            name: Sub-panel Ground (CT16)

      - type: history-graph
        title: Last 24 Hours
        hours_to_show: 24
        entities:
          - entity: input_text.ground_hunt_note
            name: Note
          - entity: sensor.main_panel_ground_out_current
            name: Main Panel Ground (CT15)
          - entity: sensor.inverter_panel_ground_out_current
            name: Sub-panel Ground (CT16)

      - type: history-graph
        title: Neutral vs Ground - Last 30 Minutes
        hours_to_show: 0.5
        entities:
          - entity: input_text.ground_hunt_note
            name: Note
          - entity: sensor.service_neutral_current
            name: Service Neutral
          - entity: sensor.main_panel_ground_out_current
            name: Ground Loop (CT15)
          - entity: sensor.house_neutral_return_current
            name: House Return
          - entity: sensor.expected_neutral_current
            name: Minimum Return |L1 - L2|
          - entity: sensor.neutral_shortfall
            name: Unaccounted
          - entity: sensor.barn_neutral_excess
            name: Extra on Barn Neutral
          - entity: sensor.ground_return_share
            name: Return via Ground

      # Flat under any load; should fall to a few hundredths once the
      # service neutral fault is fixed.
      - type: history-graph
        title: Neutral / Ground Path Ratio - Last 24 Hours
        hours_to_show: 24
        entities:
          - entity: input_text.ground_hunt_note
            name: Note
          - entity: sensor.neutral_to_ground_path_ratio
            name: R(neutral) / R(ground loop)

      # Context: an open neutral usually shows up as the two legs drifting
      # apart (one high, one low) when load is unbalanced. If L1 and L2 read
      # identically all the time, the SEM-METER is only sampling one voltage
      # reference and this graph won't show it - use a meter at the panel.
      - type: history-graph
        title: Leg Voltages - Last 30 Minutes
        hours_to_show: 0.5
        entities:
          - entity: sensor.inverter_in_l1_voltage
            name: Main Panel L1
          - entity: sensor.inverter_in_l2_voltage
            name: Main Panel L2
          - entity: sensor.inverter_out_l1_voltage
            name: Inverter Panel L1
          - entity: sensor.inverter_out_l2_voltage
            name: Inverter Panel L2

      # Active power on the ground CTs: V x I x cos(phi) against whatever
      # voltage reference the SEM-METER pairs with channels 15/16. The
      # magnitude isn't a real power flow, but the SIGN and how it tracks
      # the current hint at phase: near-zero W with real current means the
      # ground current is ~90 deg from that reference (capacitive/leakage);
      # W tracking A closely means it's in phase with that leg's load
      # current. Verify the meter's sign convention against a known load
      # before reading anything into it.
      - type: history-graph
        title: Ground Channel Active Power - Last 30 Minutes
        hours_to_show: 0.5
        entities:
          - entity: input_text.ground_hunt_note
            name: Note
          - entity: sensor.main_panel_ground_out_active_power
            name: Main Panel Ground (CT15)
          - entity: sensor.inverter_panel_ground_out_active_power
            name: Sub-panel Ground (CT16)

      - type: statistics-graph
        title: Ground Current - Last 7 Days (hourly max)
        entities:
          - entity: sensor.main_panel_ground_out_current
            name: Main Panel Ground (CT15)
          - entity: sensor.inverter_panel_ground_out_current
            name: Sub-panel Ground (CT16)
          - entity: sensor.service_neutral_current
            name: Service Neutral
        stat_types:
          - max
          - mean
        days_to_show: 7
        period: hour
